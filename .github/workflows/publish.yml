# Nightly publish (docs/06, docs/OPERATIONS.md step 9). Written 2026-09-18; live since 2026-09-21, when Kyle
# created the Cloudflare resources and set the repository variable PUBLISH_ENABLED=true. Unset it to stop publishing.
#
# What it does, in order:
#   0. Runs `pnpm preflight`: the keys, the Worker's config, and the dated lines in api/edge-protections.md where a
#      person signed that the Cloudflare Access policy and the WAF rate-limiting rule exist. Any "stop" ends the job
#      before anything is built (audit 2026-09-20). Prove the two from outside with `pnpm smoke -- https://<domain>`.
#   1. (City events: dropped until a real feed exists, DECISIONS 2026-09-19.)
#   2. Checks the emergency numbers against their owners' pages and stamps the date of each match. A page that
#      can't be read (down, or bot protection) changes nothing. A page that shows a different number stamps
#      mismatch_on, and the release build below then fails: yesterday's bundle stays up and a person reads the
#      page (DECISIONS 2026-09-19). The script never rewrites a number.
#   3. Builds the signed release bundle from what is committed on main, builds the PWA, deploys to Pages,
#      and commits data/hsds/ so every publish is in git.
#   4. Re-reads the other open-data sources. Any change (a station's address, a greenway phase, a street) is
#      NOT published: it opens a pull request. Merging it is the steward's approval (DECISIONS: "held for
#      steward approval").
#   5. Re-reads each active listing's own web page. A page that no longer shows the listing's phone or street
#      address, or can't be read, becomes a task in the steward queue ("Pages that changed"); nothing in the app
#      changes (DECISIONS 2026-09-19). The notes this writes into data/seed/resources.csv are NOT committed.
#
# Secrets (names only; docs/OPERATIONS.md): BUNDLE_SIGNING_KEY, ACCESS_CLIENT_ID, ACCESS_CLIENT_SECRET,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Variables: PUBLISH_ENABLED, BUNDLE_PUBLIC_KEYS, REPORTS_API,
# PAGES_PROJECT.
name: publish
on:
  schedule:
    - cron: '0 8 * * *'          # 04:00 in Detroit (03:00 in winter)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No dependency cache in this job: it holds the signing key, and a poisoned cache could reach it.
      - uses: actions/setup-node@v7
        with: { node-version: 22, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: |
          git config user.name "313-help-publish"
          git config user.email "actions@users.noreply.github.com"

      # 2 + 3. Gate, build, deploy. Any failure here stops the job before anything is published.
      - name: Emergency numbers still match their owners' pages
        continue-on-error: true       # a mismatch is enforced by the release build below
        run: pnpm check:emergency
      - run: pnpm test
      # Is this checkout allowed to publish at all? The keys, the Worker's config, and the two protections that live
      # in the Cloudflare dashboard and that a person has signed for in api/edge-protections.md (audit 2026-09-20).
      # An unsigned line stops the publish here, before anything is built or deployed.
      - name: Ready to publish?
        run: pnpm preflight
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
          BUNDLE_PUBLIC_KEYS: ${{ vars.BUNDLE_PUBLIC_KEYS }}
      - name: Signed release bundle
        run: pnpm build:bundle:release
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
          REPORTS_API: ${{ vars.REPORTS_API }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
      - name: Build the app with the pinned public keys
        run: pnpm --filter @313help/web build
        env:
          BUNDLE_PUBLIC_KEYS: ${{ vars.BUNDLE_PUBLIC_KEYS }}
          WEB_RELEASE: '1'     # refuses to build unless two good keys are pinned and the list is release-signed
      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @313help/api exec wrangler pages deploy ../apps/web/dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit what was published
        run: |
          git add data/hsds data/seed/emergency.csv
          git diff --cached --quiet || git commit -m "Publish $(date -u +%F): HSDS export, emergency check date"
          git push

      # 4. Everything else from open data is held for a person. The street map changes rarely: monthly.
      - name: Re-read open data
        continue-on-error: true
        run: |
          pnpm --filter @313help/pipeline ingest:opendata
          pnpm --filter @313help/pipeline ingest:greenway
          pnpm --filter @313help/pipeline ingest:city parks
          pnpm --filter @313help/pipeline ingest:city zips
          if [ "$(date -u +%d)" = "01" ]; then pnpm ingest:basemap; pnpm ingest:neighborhoods; fi
      - name: Open a pull request if a source changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/ingested data/staging
          if git diff --cached --quiet; then echo "No source changed."; exit 0; fi
          branch="ingest/$(date -u +%F)"
          # -B and --force-with-lease so a second run on the same day updates that day's branch instead of failing on
          # a name that already exists; the branch is only ever written by this job.
          git checkout -B "$branch"
          git commit -m "Open data changed on $(date -u +%F): review before it is published"
          # A fresh checkout knows nothing about that day's branch on the server, and --force-with-lease with nothing
          # to compare against refuses the push ("stale info") — which is what failed the second run on 2026-09-21.
          # Fetch it first when it exists, so the lease has the server's real state to hold the push to.
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push -u --force-with-lease origin "$branch"
          gh pr create --title "Open data changed $(date -u +%F)" --body "A City source changed. Read the diff: a changed phone number, address or coordinate is published only when this is merged. Nothing here was published tonight." --base main --head "$branch" \
            || echo "A pull request for $branch is already open; it now has tonight's changes too."

      # 5. The nightly re-check. It runs even if a step above failed, and never fails the job: a flaky page must
      #    not block a publish. Nothing here is committed: the resources.csv notes stay on this runner, and
      #    data/staging/recheck.json is git-ignored. tasks:sync sends nothing if the re-check didn't finish.
      - name: Re-check each listing's own page
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm --filter @313help/pipeline check:sources --recheck
      - name: Send pages that changed to the steward queue
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm tasks:sync
        env:
          REPORTS_API: ${{ vars.REPORTS_API }}
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
