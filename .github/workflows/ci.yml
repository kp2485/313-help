name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Pinned so a runner image change is a deliberate upgrade, not a surprise on demo day.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6        # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Dev build: proves the seed is valid, HSDS-valid, and signable. Release builds run in publish.yml with
      # BUNDLE_SIGNING_KEY, and fail when an emergency number has gone 30 days without matching its owner's page.
      - run: pnpm build:bundle
      # The PWA pins the dev key the bundle step just wrote, then builds with the bundle copied in.
      - run: pnpm --filter @313help/web build

  # The iPhone app's copy of the query rules, held to the same fixtures as the web (schema/fixtures).
  # Runs in the official Swift image, so the compiler version is exact and no third-party setup action is needed.
  ios-query:
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: apps/ios

  # The Android app's copy of the query rules, held to the same fixtures as the web and the iPhone, plus the
  # app's android-free half (:core) — the Ed25519 check and the small-order keys it refuses, what makes a bundle
  # acceptable, what a report is and its one-day hash, the maps/call rules, and the needs list held to
  # apps/web/src/needs.ts.
  #
  # Since 2026-09-21 :core also covers the **Map tab's** whole arithmetic, which is the part of that screen where
  # a mistake is worst: the projection and the delta decoder for the bundle's map files (the real shipped files
  # are decoded here, so a change to the pipeline's encoding is caught in CI rather than on a phone), the camera
  # and its clamps, hit testing, the flick, and — above all — `mapDrawable`, the one predicate that decides that a
  # domestic-violence, crisis, treatment or sexual-assault listing is never a dot, never a row and never a spoken
  # node. Those tests are a case-for-case port of apps/ios/Tests/HelpCoreTests/MapTests.swift, so the two apps
  # cannot drift apart without one of them going red.
  #
  # And the optional **subway map style** (docs/MAP-STYLE.md), all of it that is not pixels: the zoom bands, the
  # network-file decoders, the geometry, the settled badge claim and reading-order caps — a case-for-case port of
  # apps/ios/Tests/HelpCoreTests/MapStyleTests.swift — and the palette as numbers, which this job holds to
  # apps/web/src/style.css by PARSING it (a token that differs fails here) and to the spec's contrast tables by
  # computing them. The tests that decode the real network files skip here, as the other shipped-bundle tests do,
  # because data/bundle is built, never committed.
  #
  # Since 2026-09-20 :core also covers the *rules* that used to be tangled up in the two files that talk to the
  # network and the disk, and so were checked by nothing this job ran: which file paths a signed index may name,
  # what header goes out and where a report may be posted (Net.kt, Http.kt), what happens to the report queue when
  # a flush and a tap overlap (Outbox.kt), and which screens are private and what may survive an activity being
  # recreated (Route.kt). Those four files have no android.* class in them on purpose, and :core will stop
  # compiling if one of them grows one.
  #
  # A JDK is all this needs: no module here touches an android.* class, and settings.gradle.kts leaves :app out
  # of the build when there is no Android SDK. The screens are still compiled by nothing anywhere; adding that
  # needs the SDK licence accepted on this repository's behalf (apps/android/README.md).
  #
  # These are exactly the two commands that were run on a laptop on 2026-09-20, on the same JDK 17.
  android-query:
    runs-on: ubuntu-24.04
    # A GitHub ubuntu runner ships an Android SDK in ANDROID_HOME, so this job was not the JDK-only build it was
    # written to be: settings.gradle.kts found that SDK, pulled :app in, and the job went red on 2026-09-20. The
    # override says out loud what this job builds instead of leaving it to whatever a runner image happens to
    # contain. :app is deliberately NOT built here: it needs platform and build-tools packages under Google's SDK
    # licence, and accepting a licence on this repository's behalf in CI is not something a workflow should do
    # quietly. The screens are compiled on a laptop with the SDK (apps/android/README.md); everything CI runs
    # needs a JDK and nothing else.
    env:
      HELP313_NO_ANDROID: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # ./gradlew, so the Gradle version is the one pinned in gradle/wrapper/gradle-wrapper.properties.
      - run: ./gradlew --no-daemon :query:test :core:test
        working-directory: apps/android
      # The same 190 fixture cases again with no test framework on the classpath at all, which is the route that
      # still works if JUnit (EPL-1.0, test-only) is ever dropped.
      - run: ./gradlew --no-daemon :query:runFixtures
        working-directory: apps/android
