name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Pinned so a runner image change is a deliberate upgrade, not a surprise on demo day.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6        # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Dev build: proves the seed is valid, HSDS-valid, and signable. Release builds run in publish.yml with
      # BUNDLE_SIGNING_KEY, and fail when an emergency number has gone 30 days without matching its owner's page.
      - run: pnpm build:bundle
      # The PWA pins the dev key the bundle step just wrote, then builds with the bundle copied in.
      - run: pnpm --filter @313help/web build

  # The iPhone app's copy of the query rules, held to the same fixtures as the web (schema/fixtures).
  # Runs in the official Swift image, so the compiler version is exact and no third-party setup action is needed.
  ios-query:
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
      - run: swift test
        working-directory: apps/ios

  # The Android app's copy of the query rules, held to the same fixtures as the web and the iPhone, plus the
  # app's android-free half (:core) — the Ed25519 check, what a report is and its one-day hash, the maps/call
  # rules, and the needs list held to apps/web/src/needs.ts.
  #
  # A JDK is all this needs: neither module touches an android.* class, and settings.gradle.kts leaves :app out
  # of the build when there is no Android SDK. The screens are still compiled by nothing anywhere; adding that
  # needs the SDK licence accepted on this repository's behalf (apps/android/README.md).
  #
  # These are exactly the two commands that were run on a laptop on 2026-09-20, on the same JDK 17.
  android-query:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # ./gradlew, so the Gradle version is the one pinned in gradle/wrapper/gradle-wrapper.properties.
      - run: ./gradlew --no-daemon :query:test :core:test
        working-directory: apps/android
      # The same 111 fixture cases again with no test framework on the classpath at all, which is the route that
      # still works if JUnit (EPL-1.0, test-only) is ever dropped.
      - run: ./gradlew --no-daemon :query:runFixtures
        working-directory: apps/android
