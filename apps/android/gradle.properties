org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No Jetpack Compose, no AndroidX, no data binding: the app uses the platform view classes only, so the APK is
# the Kotlin standard library plus our own code. See apps/android/README.md for why.
android.useAndroidX=false
android.nonTransitiveRClass=true

kotlin.code.style=official

# Where the published bundle lives. A build that leaves the placeholder reaches nothing at all and lives on the
# snapshot shipped inside the APK. Override with -PbundleBase=https://<domain>/data/bundle/v1/
bundleBase=https://REPLACE-ME.invalid/data/bundle/v1/

# Release signing keys for the bundle: two different base64 SPKI Ed25519 public keys, comma separated
# (active and spare), the same values as BUNDLE_PUBLIC_KEYS. A release build fails until these are set, and
# fails if either one is the development key. Never put a private key here or anywhere in this repository.
# Pass with -PbundlePublicKeys=... or the BUNDLE_PUBLIC_KEYS environment variable.
