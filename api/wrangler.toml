# Creating the D1 database, the Worker, the Access application and the rate-limiting rule all need Kyle's
# go-ahead (CLAUDE.md). See docs/OPERATIONS.md, "First deployment".
#
# The Worker deploys from Git (Kyle, 2026-09-20): in the Cloudflare project, set
#   Root directory:  api
#   Deploy command:  npx wrangler deploy
# The repository root has no Worker config on purpose - it is a pnpm workspace, and the site is built and
# deployed by .github/workflows/publish.yml, not by Cloudflare. Pointing a Cloudflare build at the root fails
# with "application detection logic has been run in the root of a workspace".
name = "313-help-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Zero-PII: Workers Logs is off entirely, and Logpush stays off.
# Cloudflare's own words: "Each Workers invocation returns a single invocation log that contains details such as the
# Request, Response, and related metadata", and "All console.log() statements, exceptions, request metadata, and
# headers are automatically captured during the Worker invocation"
# (https://developers.cloudflare.com/workers/observability/logs/workers-logs/). `invocation_logs = false` stops the
# per-request log; what the docs do not say is whether an uncaught exception still lands somewhere (`Exceptions` is a
# field of that same invocation log), and an exception message from D1 can quote the statement and its bound values -
# a per-day dedupe hash, a steward's note, a masked detail. Kept for up to 7 days (3 on the free plan) and
# readable by anyone who can open the dashboard, that is a record of residents' requests we promised not to keep
# (CLAUDE.md). So: `enabled = false`, and the Worker also logs nothing of its own (src/log.ts, enforced by a test in
# api/test/api.test.ts). Aggregate Worker metrics - requests, errors, CPU time - do not come from Workers Logs and are
# still in the dashboard; live debugging is `wrangler tail`, which streams to a terminal and stores nothing.
[observability.logs]
enabled = false
invocation_logs = false

[[d1_databases]]
binding = "DB"
database_name = "313-help"
database_id = "ab7b665d-e4ef-423b-ba77-fcb355cdf222"
migrations_dir = "migrations"

# Photos on condition reports (docs/11): a PRIVATE bucket. No public access, no custom domain, ever.
# The binding is commented out because the bucket does not exist yet and a deploy would fail on it. With no
# binding the Worker answers 503 to photo uploads and the app sends the report without the photo, which is what
# PHOTOS_ENABLED = "false" does anyway. `wrangler dev` fakes the bucket locally.
# To turn photos on later (needs Kyle's go-ahead and the legal advice in docs/11):
#   wrangler r2 bucket create 313-help-photos
# then uncomment the three lines below and set PHOTOS_ENABLED = "true".
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "313-help-photos"

[vars]
PHOTOS_ENABLED = "false"     # photos on condition reports: off until the legal advice in docs/11 (DECISIONS 2026-09-19)
ALLOWED_ORIGIN = "https://313help.com"
ACCESS_TEAM_DOMAIN = "313help.cloudflareaccess.com"
ACCESS_AUD = "00df5d305b6e52fce68686ad9dc4f9a17d54145d588bc9f2d5d9bf72787df3a5"

[triggers]
crons = ["17 8 * * *"]       # daily retention pass: raw reports older than 180 days become monthly counts

# Abuse control lives at Cloudflare's edge as a WAF rate-limiting rule on POST /v1/* (per IP, e.g.
# 10 requests per minute). It is configured in the dashboard, not here, so that this code never
# has to touch an IP address. Cloudflare processes IPs in transit; we never read or store them.
