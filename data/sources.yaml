# Registry of sources (docs/02). All sources are read-only; never write back.
# mode: publish = rows enter the bundle labeled with the source and its last-edit date
#                 (allowed only while the layer was edited within max_age_days)
#       stage   = rows land in data/staging/ as candidates and need an entry check
# Staff contact-name fields are never ingested. Phone/address changes show up as a
# git diff of data/ingested/*.csv and are approved by merging that diff (10-A5).

sources:
  - id: dhd_harm_reduction
    name: Detroit Health Department harm reduction station list
    tier: A
    kind: arcgis
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/DHD_Harm_Reduction_List_view/FeatureServer/0
    page: https://detroitmi.gov/departments/detroit-health-department/programs-and-services/behavioral-health-program/harm-reduction
    license: unstated   # City portal states no license; ask (10-B12). Facts only; attributed.
    mode: publish
    max_age_days: 90
    category: harm.narcan
    org: { id: org_dhd, name: Detroit Health Department }
    fields: { name: Location_Description, address: Address, phone: Phone_Number, website: Website, hours: Hours_of_Operations, ref: GlobalID }
    extra: [Distribution_Device_Type, Box_Location, Type_of_Business]
    id_prefix: hr

  - id: rec_centers
    name: City of Detroit Recreation Centers layer
    tier: A
    kind: arcgis
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/RecCenters/FeatureServer/0
    license: unstated
    mode: stage          # last edited 2016-11-16: names/addresses/coordinates only, check each at entry
    max_age_days: 90
    category: shelter.cooling
    org: { id: org_detroit_parks_rec, name: Detroit Parks & Recreation }
    fields: { name: Site, address: Address, zip: Zip, phone: Phone }   # Contact (staff names) deliberately not mapped
    id_prefix: rec

  - id: jlg_route_segments
    name: Joe Louis Greenway Route Segments
    tier: A
    kind: arcgis_lines   # handled by ingest-greenway.ts -> data/ingested/jlg_segments.json
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Joe_Louis_Greenway_Routes/FeatureServer/0
    license: unstated
    # docs/11 approved 2026-09-18. PHASE_DESCRIPTION (Open / Under Construction / Funded / Unfunded)
    # is the truth for "can I walk here today".

  # Drug and alcohol treatment (DECISIONS 2026-09-19, "use SAMHSA's lists"). Read by pipeline/src/ingest-treatment.ts
  # (pnpm ingest:treatment), which stages every program in the four cities in data/staging/samhsa_treatment.csv and
  # writes import lines only for programs whose own website DWIHN names; check:sources decides from there.
  - id: samhsa_treatment_directory
    name: SAMHSA National Directory of Drug and Alcohol Use Treatment Facilities (2025 edition, 2024 survey)
    tier: A
    kind: samhsa_directory
    url: https://www.samhsa.gov/data/sites/default/files/reports/rpt57009/2025_SU_Facilities_for_All_City_All.xlsx
    page: https://www.samhsa.gov/data/data-we-collect/n-sumhss-national-substance-use-and-mental-health-services-survey/national-directories
    license: public domain   # "This publication is in the public domain ... may not be reproduced or distributed for a fee"
    mode: stage

  - id: samhsa_otp_directory
    name: SAMHSA Opioid Treatment Program Directory
    tier: A
    kind: samhsa_otp
    url: https://www.samhsa.gov/find-help/locators/opioid-treatment-program-directory/export?page&_format=csv
    page: https://www.samhsa.gov/find-help/locators/opioid-treatment-program-directory
    license: public domain (federal government work)
    mode: stage

  - id: dwihn_provider_directory
    name: Detroit Wayne Integrated Health Network provider directory
    tier: A
    kind: dwihn_providers
    url: https://dwihn.org/sites/default/files/providers-practitioners/provider-directory.csv
    license: unstated   # public provider directory; used only to match programs and find their own websites
    mode: stage
