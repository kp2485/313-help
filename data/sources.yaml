# Registry of sources (docs/02). All sources are read-only; never write back.
# mode: publish = rows enter the bundle labeled with the source and its last-edit date
#                 (allowed only while the layer was edited within max_age_days)
#       stage   = rows land in data/staging/ as candidates and need an entry check
# Staff contact-name fields are never ingested. Phone/address changes show up as a
# git diff of data/ingested/*.csv and are approved by merging that diff (10-A5).

sources:
  - id: dhd_harm_reduction
    name: Detroit Health Department harm reduction station list
    tier: A
    kind: arcgis
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/DHD_Harm_Reduction_List_view/FeatureServer/0
    page: https://detroitmi.gov/departments/detroit-health-department/programs-and-services/behavioral-health-program/harm-reduction
    license: unstated   # City portal states no license; ask (10-B12). Facts only; attributed.
    mode: publish
    max_age_days: 90
    category: harm.narcan
    org: { id: org_dhd, name: Detroit Health Department }
    fields: { name: Location_Description, address: Address, phone: Phone_Number, website: Website, hours: Hours_of_Operations, ref: GlobalID }
    extra: [Distribution_Device_Type, Box_Location, Type_of_Business]
    id_prefix: hr

  # Wayne County's own station map (Kyle, 2026-09-20). 97 stations countywide; the 26 in the service area enter as
  # listings, facts only and attributed to the County. Read by pipeline/src/ingest-mymap.ts (pnpm ingest:mymap).
  # The map gives a site name, a city, coordinates, the device type, whether it is 24/7 and where the box sits —
  # no street address and no phone, so these rows carry their own city and no address (DECISIONS 2026-09-20).
  - id: wayne_well_wayne_stations
    name: Wayne County Well Wayne Stations location map
    tier: A
    kind: google_mymap   # the map's own KML, not ArcGIS
    url: https://www.google.com/maps/d/kml?mid=1fXAp9hNo57tOnuFW1DOKiae7InicBpw&forcekml=1
    page: https://endoverdosewayne.org/
    license: unstated   # the County's page states none; ask before we rely on it. Facts only; attributed.
    mode: publish
    max_age_days: 90    # measured against the map's own "Map updated:" date
    category: harm.supplies
    wording: supplies_station   # naloxone AND fentanyl/xylazine test strips, not Narcan only
    cities: [Detroit, Dearborn, Hamtramck, Highland Park]   # the service area; Dearborn Heights is not Dearborn
    org: { id: org_wayne_hhvs, name: "Wayne County Department of Health, Human and Veterans Services" }
    id_prefix: wws

  # "Get somewhere safe now" (DECISIONS 2026-09-22, Kyle's plan decision 3): police and fire stations are
  # ingested from City open data as 24-hour destinations beside the emergency rooms. Read by
  # pipeline/src/ingest-safe.ts (pnpm ingest:safe), which keeps the public-facing buildings and drops the rest:
  # a training academy, a radio shop and an aviation hangar are not places to walk into at 3am.
  #
  # The City's own pages (detroitmi.gov) have refused this pipeline's fetcher since 2026-09-20
  # (data/seed/script-refusing-hosts.csv), so these rows claim no page read: their badge is the plain
  # "from the City's list, last updated ..." one, and confirming the lobby wording by eye is a steward job
  # (docs/CHECKS-2026-09-22.md).
  - id: detroit_police_precincts
    name: City of Detroit Police Precinct Buildings layer
    tier: A
    kind: arcgis_safe
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Precinct_Buildings/FeatureServer/0
    page: https://detroitmi.gov/departments/police-department
    license: unstated   # City portal states no license; ask (10-B12). Facts only; attributed.
    mode: publish
    # The City last edited this layer on 2018-07-19. A precinct building is not a pop-up: the twelve numbered
    # precincts have been at these addresses for years, and the same twelve addresses appear again in the City's
    # separate Public Safety Locations layer (edited 2021-01). The date is not hidden — it is what the badge on
    # every one of these rows prints — so the reader can judge it (DECISIONS 2026-09-22).
    max_age_days: 4000
    category: safe.police
    wording: police_station
    org: { id: org_detroit_police, name: Detroit Police Department }
    # `Leadership` and `NPO` are staff names and officers' mobile numbers. They are deliberately not mapped and
    # must never be added: a listing names a place, never a person (docs/08).
    fields: { name: Precinct, address: Address, city: City, zip: Zip, phone: Phone }
    id_prefix: dpd

  - id: detroit_fire_stations
    name: Detroit Fire Department Fire Stations layer
    tier: A
    kind: arcgis_safe
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/DFD_Fire_Station_Locations/FeatureServer/0
    page: https://detroitmi.gov/departments/detroit-fire-department
    license: unstated
    mode: publish
    max_age_days: 4000   # data last edited 2024-02-24; same reasoning as the precincts above
    category: safe.fire
    wording: fire_station
    org: { id: org_detroit_fire, name: Detroit Fire Department }
    # The layer publishes no phone number, so these rows carry none: a fire station's own bell is the way in,
    # and 911 is the number. `Lat`/`Long` in this layer are swapped, so the ingest reads the geometry instead.
    fields: { name: Firehouse, address: Address, ref: FH_Short }
    id_prefix: dfd

  - id: rec_centers
    name: City of Detroit Recreation Centers layer
    tier: A
    kind: arcgis
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/RecCenters/FeatureServer/0
    license: unstated
    mode: stage          # last edited 2016-11-16: names/addresses/coordinates only, check each at entry
    max_age_days: 90
    category: shelter.cooling
    org: { id: org_detroit_parks_rec, name: Detroit Parks & Recreation }
    fields: { name: Site, address: Address, zip: Zip, phone: Phone }   # Contact (staff names) deliberately not mapped
    id_prefix: rec

  # The City's own "Food Pantry Finder" (experience.arcgis.com/experience/67edf7a2d5b14c398b03dacd6d610f97), the
  # layer behind it (Kyle, 2026-09-23: "deep dive into merging the city's food map"). 97 pantries and hot-meal sites
  # with name, address, phone, hours in words and a coordinate. Owned by the City's integration account; no licence,
  # description or maintainer is stated. Last edited 2025-11-21, so it STAGES: every row is a candidate a person
  # checks (phone call or the host's own page) before it is listed. The facts belong to the hosts, not the City.
  # Cross-reference and call sheet: docs/research/2026-09-23-city-food-map.md.
  - id: city_food_map
    name: City of Detroit Food Pantry Finder layer
    tier: A
    kind: arcgis
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/food_bank_finder_data/FeatureServer/0
    page: https://experience.arcgis.com/experience/67edf7a2d5b14c398b03dacd6d610f97
    license: unstated   # the City portal states none (as for the transit layers, DECISIONS 2026-09-20); ask
    mode: stage         # last edited 2025-11-21, and the facts are the hosts', not the City's
    max_age_days: 90
    category: food.pantry   # the layer's Type says "Hot Meal" for some; carried in `extra` for the person entering it
    org: { id: org_city_of_detroit, name: City of Detroit }
    fields: { name: Name, address: Address, zip: Zip_Code, phone: Telephone, hours: Hours, ref: Name+Address }
    extra: [Type, council_district, neighborhood_name]
    id_prefix: cfm

  - id: jlg_route_segments
    name: Joe Louis Greenway Route Segments
    tier: A
    kind: arcgis_lines   # handled by ingest-greenway.ts -> data/ingested/jlg_segments.json
    url: https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Joe_Louis_Greenway_Routes/FeatureServer/0
    license: unstated
    # docs/11 approved 2026-09-18. PHASE_DESCRIPTION (Open / Under Construction / Funded / Unfunded)
    # is the truth for "can I walk here today".

  # Drug and alcohol treatment (DECISIONS 2026-09-19, "use SAMHSA's lists"). Read by pipeline/src/ingest-treatment.ts
  # (pnpm ingest:treatment), which stages every program in the four cities in data/staging/samhsa_treatment.csv and
  # writes import lines only for programs whose own website DWIHN names; check:sources decides from there.
  - id: samhsa_treatment_directory
    name: SAMHSA National Directory of Drug and Alcohol Use Treatment Facilities (2025 edition, 2024 survey)
    tier: A
    kind: samhsa_directory
    url: https://www.samhsa.gov/data/sites/default/files/reports/rpt57009/2025_SU_Facilities_for_All_City_All.xlsx
    page: https://www.samhsa.gov/data/data-we-collect/n-sumhss-national-substance-use-and-mental-health-services-survey/national-directories
    license: public domain   # "This publication is in the public domain ... may not be reproduced or distributed for a fee"
    mode: stage

  - id: samhsa_otp_directory
    name: SAMHSA Opioid Treatment Program Directory
    tier: A
    kind: samhsa_otp
    url: https://www.samhsa.gov/find-help/locators/opioid-treatment-program-directory/export?page&_format=csv
    page: https://www.samhsa.gov/find-help/locators/opioid-treatment-program-directory
    license: public domain (federal government work)
    mode: stage

  - id: dwihn_provider_directory
    name: Detroit Wayne Integrated Health Network provider directory
    tier: A
    kind: dwihn_providers
    url: https://dwihn.org/sites/default/files/providers-practitioners/provider-directory.csv
    license: unstated   # public provider directory; used only to match programs and find their own websites
    mode: stage

# ---------------------------------------------------------------------------------------------------------
# NOT LISTINGS. The four-city pages (docs/13, "The four cities"; DECISIONS 2026-09-22) are built from regional
# and federal layers that become NUMBERS, never rows in the directory, so they have no entry above: like the
# map, parks, ZIP and neighborhood layers, they are named at the top of their own ingest script,
# pipeline/src/ingest-cities.ts (`pnpm ingest:cities`), with each one's licence quoted there and in docs/02.
# Recorded here so the registry names them too:
#
#   SEMCOG, Pavement Condition 2003 to 2024 (PASER)   road condition   SEMCOG Copyright License Agreement
#   SEMCOG, park_poly_2023_view                       parks + acres    SEMCOG Copyright License Agreement
#   SEMCOG, mcd_2020                                  2020 Census housing units and vacant units, per city
#   U.S. Census Bureau, Building Permits Survey       new homes permitted, per permit-issuing place
#   U.S. Census Bureau, TIGERweb places               the four city outlines (already used by the map)
#   Wayne County, Parcels_AssessmentData              a parcel count, as a denominator. Counts only: the layer
#                                                     holds OwnerName and OwnerAddress and we never ask for them
#
# SEMCOG's agreement is accepted as it stands, indemnification clause included, for every panel that uses its
# data (Kyle, DECISIONS 2026-09-22), and its required notice is printed on every SEMCOG-sourced panel.
# BS&A Online, which runs assessing, tax and permits for all three smaller cities, prohibits automated access
# in its own terms: we do not read it, we do not deep-link it, and the panels it would have fed are absent.
